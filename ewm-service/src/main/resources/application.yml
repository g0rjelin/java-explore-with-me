server:
  port: 8080
stats-service:
  url: ${STATS_SERVICE_URL:http://localhost:9090}
spring:
  application:
    name: ewm-service
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        use_sql_comments: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ewmdb
    username: ewm
    password: ewm
    driverClassName: org.postgresql.Driver
  sql:
    init:
      mode: always
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type: TRACE
        orm:
          jdbc:
            bind: TRACE
      springframework:
        orm:
          jpa: INFO
          jpa.JpaTransactionManager: DEBUG
        transaction: INFO
        transaction.interceptor: TRACE